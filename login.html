<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TARCinema</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <form id="login-form" class="auth-form">
        <h2>Login ke Akun Anda</h2>

        <!-- Error text ditengah -->
        <p id="login-global-error" class="error-text hidden">
          Kredensial tidak valid. Silakan coba lagi.
        </p>

        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Alamat email" required>

        <label for="login-password">Kata Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="login-password" placeholder="Kata Sandi" required>
          <span class="toggle-pass" data-target="login-password">👁</span>
        </div>

        <button type="submit" class="btn-submit">Masuk</button>

        <p>Belum punya akun? <a href="register.html">Daftar di sini</a></p>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
