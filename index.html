<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Now Playing - </title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="container">
      <h1 class="brand">TARCinema</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="history.html">Riwayat</a>
        <a href="customer.html">Layanan</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="search">
      <input id="searchInput" placeholder="Cari film..." />
    </section>

    <section>
      <h2>Now Playing</h2>
      <div id="nowPlaying" class="cards-grid"></div>
    </section>

    <section>
      <h2>Coming Soon</h2>
      <div id="comingSoon" class="cards-grid"></div>
    </section>
  </main>

  <footer class="container footer">© TARCinema </footer>
  <script>
  $(function () {
    const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!loggedInUser) {
      alert('Silakan login dulu.');
      window.location.href = 'login.html';
      return;
    }

    // Tampilkan nama user di navbar (opsional)
    $('.navbar .container').append(
      `<span style="margin-left:20px;">Hai, ${loggedInUser.name} | <a href="#" id="logout-link">Logout</a></span>`
    );

    // Logout
    $('#logout-link').on('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('loggedInUser');
      window.location.href = 'login.html';
    });

    renderHome();
  });
</script>

  <script src="js/app.js"></script>
  <script>
    $(function(){
      renderHome();
    });
  </script>
</body>
</html>
